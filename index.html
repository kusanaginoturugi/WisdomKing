<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聖明王院 システム</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-theme="traditional">

  <!-- ─── ヘッダー ─── -->
  <header>
    <div class="header-brand">
      <div class="header-emblem">

        <!-- 八葉紋（伝統テーマ） -->
        <svg class="v-classic" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="22" stroke="#c8a44a" stroke-width="1.2" opacity="0.6"/>
          <circle cx="24" cy="24" r="17" stroke="#c8a44a" stroke-width="0.6" opacity="0.4"/>
          <g opacity="0.75">
            <ellipse cx="24" cy="12" rx="2.5" ry="5" fill="#c8a44a" opacity="0.5"/>
            <ellipse cx="24" cy="36" rx="2.5" ry="5" fill="#c8a44a" opacity="0.5"/>
            <ellipse cx="12" cy="24" rx="5" ry="2.5" fill="#c8a44a" opacity="0.5"/>
            <ellipse cx="36" cy="24" rx="5" ry="2.5" fill="#c8a44a" opacity="0.5"/>
            <ellipse cx="15.5" cy="15.5" rx="2.5" ry="5" fill="#c8a44a" opacity="0.35" transform="rotate(-45 15.5 15.5)"/>
            <ellipse cx="32.5" cy="15.5" rx="2.5" ry="5" fill="#c8a44a" opacity="0.35" transform="rotate(45 32.5 15.5)"/>
            <ellipse cx="15.5" cy="32.5" rx="2.5" ry="5" fill="#c8a44a" opacity="0.35" transform="rotate(45 15.5 32.5)"/>
            <ellipse cx="32.5" cy="32.5" rx="2.5" ry="5" fill="#c8a44a" opacity="0.35" transform="rotate(-45 32.5 32.5)"/>
          </g>
          <circle cx="24" cy="24" r="5" fill="#c8a44a" opacity="0.85"/>
          <circle cx="24" cy="24" r="2.5" fill="#080c14"/>
        </svg>

        <!-- 幾何学マーク（モダンテーマ） -->
        <svg class="v-modern" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="40" height="40" rx="10" stroke="#4f46e5" stroke-width="1.5" fill="none"/>
          <rect x="4" y="4" width="40" height="40" rx="10" fill="#4f46e5" opacity="0.06"/>
          <path d="M11 18 L16 30 L21 20 L24 26 L27 20 L32 30 L37 18"
                stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>

      </div>
      <div class="header-title">
        <h1>聖明王院</h1>
        <p>
          <span class="v-classic">Wisdom King Temple &mdash; System Portal</span>
          <span class="v-modern">WisdomKing &mdash; System Portal</span>
        </p>
      </div>
    </div>

    <!-- テーマ切替 -->
    <div class="theme-toggle" role="group" aria-label="テーマ切替">
      <button type="button" class="theme-btn" data-theme-target="traditional">伝統</button>
      <button type="button" class="theme-btn" data-theme-target="modern">現代</button>
    </div>
  </header>

  <!-- ─── メイン ─── -->
  <main>
    <div class="section-heading">
      <span class="label">
        <span class="v-classic">Services</span>
        <span class="v-modern">Systems</span>
      </span>
      <h2>
        <span class="v-classic">御システム一覧</span>
        <span class="v-modern">システム一覧</span>
      </h2>
      <div class="divider"></div>
    </div>

    <div class="card-grid" id="service-grid"></div>
  </main>

  <!-- ─── フッター ─── -->
  <footer>
    <div class="footer-org">聖明王院</div>
    <div class="footer-copy">&copy; <span id="year"></span> WisdomKing. All rights reserved.</div>
  </footer>

  <script src="js/app.js"></script>

</body>
</html>
